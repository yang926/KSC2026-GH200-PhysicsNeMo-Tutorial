defaults :
  - physicsnemo_default
  - arch:
      - fully_connected
  - scheduler: tf_exponential_lr
  - optimizer: adam
  - loss: sum
  - _self_

save_filetypes : "vtk,npz"

scheduler:
  decay_rate: 0.95
  decay_steps: 100


training:
  rec_validation_freq: 1000
  rec_inference_freq: 2000
  rec_monitor_freq: 1000
  rec_constraint_freq: 2000
  max_steps : 5000

batch_size:
  initial_x: 100
  interior: 1000

# 참가자 노트북에서 Hydra override로 바꾸는 물리 실험값입니다. 같은 값이
# 초기조건, 학습 시간 구간, Validator 정답, Inferencer 입력에 함께 적용됩니다.
custom:
  gravity: 9.81
  initial_speed: 40.0
  launch_angle_deg: 60.0
  train_time_end: 5.0
  inference_time_end: 8.0
  
graph: 
  func_arch: true
   
cuda_graphs: True
cuda_graph_warmup: 20
