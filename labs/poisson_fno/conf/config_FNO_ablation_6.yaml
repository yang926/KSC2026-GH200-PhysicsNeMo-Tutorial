# KSC 2026 optional ablation A.
# Compare with config_FNO_ablation_12.yaml: only fno_modes and output labels differ.

defaults:
  - physicsnemo_default
  - /arch/conv_fully_connected_cfg@arch.decoder
  - /arch/fno_cfg@arch.fno
  - scheduler: tf_exponential_lr
  - optimizer: adam
  - loss: sum
  - _self_

network_dir: outputs/ksc_fno_ablation/modes_6

arch:
  decoder:
    input_keys: [z, 32]
    output_keys: u
    nr_layers: 1
    layer_size: 32

  fno:
    input_keys: f
    dimension: 2
    nr_fno_layers: 4
    fno_modes: 6
    padding: 0
    coord_features: false

scheduler:
  decay_rate: 0.95
  decay_steps: 50

training:
  rec_results_freq: 50
  rec_validation_freq: 50
  save_network_freq: 100
  print_stats_freq: 20
  max_steps: 200

batch_size:
  grid: 32
  validation: 32
  test: 32

custom:
  profile: recovery
  experiment_label: ablation_modes_6
  random_seed: 2026
  train_file: datasets/Poisson_Fourier_Recovery/train.hdf5
  validation_file: datasets/Poisson_Fourier_Recovery/val.hdf5
  test_file: datasets/Poisson_Fourier_Recovery/test.hdf5
  metrics_file: outputs/ksc_fno_ablation/modes_6/final_state_test_metrics.json
  candidate_note: >-
    KSC optional ablation using the recovery dataset. Compare against the
    modes-12 config with the same seed, data, width, layers, batch size,
    optimizer, scheduler, and 200 training steps.
