# KSC 2026 recovery profile for the same periodic 2D Poisson problem.
# Run with:
#   python train_fno.py --config-name config_FNO_recovery

defaults:
  - physicsnemo_default
  - /arch/conv_fully_connected_cfg@arch.decoder
  - /arch/fno_cfg@arch.fno
  - scheduler: tf_exponential_lr
  - optimizer: adam
  - loss: sum
  - _self_

# Do not resume from or overwrite the GH200 profile's training state.
network_dir: outputs/ksc_fno_recovery

arch:
  decoder:
    input_keys: [z, 32]
    output_keys: u
    nr_layers: 1
    layer_size: 32

  fno:
    input_keys: f
    dimension: 2
    nr_fno_layers: 4
    fno_modes: 12
    padding: 0
    coord_features: false

scheduler:
  decay_rate: 0.95
  decay_steps: 100

training:
  rec_results_freq: 100
  rec_validation_freq: 100
  save_network_freq: 200
  print_stats_freq: 20
  max_steps: 400

batch_size:
  grid: 32
  validation: 32
  test: 32

custom:
  profile: recovery
  experiment_label: recovery_fallback
  random_seed: 2026
  test_example_index: 0
  train_file: datasets/Poisson_Fourier_Recovery/train.hdf5
  validation_file: datasets/Poisson_Fourier_Recovery/val.hdf5
  test_file: datasets/Poisson_Fourier_Recovery/test.hdf5
  metrics_file: outputs/ksc_fno_recovery/final_state_test_metrics.json
  candidate_note: >-
    64x64, 800/100/100 samples, width 32, 4 FNO layers, 12 modes,
    batch 32, and 400 steps form the short recovery path.
